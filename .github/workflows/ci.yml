name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the dataset from the fixture
        run: npm run build -- tests/fixtures/raw.json

  live-wikidata:
    # Query changes are checked against the real Wikidata before they publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch two countries from Wikidata
        # Great Britain is the heaviest country read in one query.
        run: npm run fetch -- MC GB
        env:
          FETCH_TRIES: "1"
      - run: npm run build
      - name: Sizes
        run: |
          du -sh public/v1 public/v1/*/*.json
          jq '.places | length' public/v1/places/index.json
          jq '.stations | length' public/v1/stations/railways.json
      - name: Read Japan and the United States in batches
        # Their towns time out in a single query: check the batches find them, and the
        # worldwide stations query finds Japan's.
        run: |
          npm run fetch -- JP US
          jq -e '[.cities[] | select(.countryIso2 == "JP")] | length > 500' data/raw/wikidata.json
          jq -e '[.cities[] | select(.countryIso2 == "US")] | length > 5000' data/raw/wikidata.json
          jq -e '[.stations[] | select(.countryIso2 == "JP")] | length > 1000' data/raw/wikidata.json
        env:
          FETCH_TRIES: "2"
          FETCH_IN_PARTS: "1"
