name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the dataset from the fixture
        run: npm run build -- tests/fixtures/raw.json

  live-wikidata:
    # Query changes are checked against the real Wikidata before they publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch three countries from Wikidata
        # Great Britain and the United States are the heaviest countries for the time limit.
        run: npm run fetch -- MC GB US
        env:
          FETCH_TRIES: "1"
      - run: npm run build
      - name: Sizes
        run: |
          du -sh public/v1 public/v1/*/*.json
          jq '.places | length' public/v1/places/index.json
          jq '.stations | length' public/v1/stations/railways.json
      - name: Read Japan in parts
        # Japan's towns and stations once timed out in a single query: check the parts find them.
        run: |
          npm run fetch -- JP
          jq -e '(.cities | length) > 500 and (.stations | length) > 1000' data/raw/wikidata.json
        env:
          FETCH_TRIES: "2"
          FETCH_IN_PARTS: "1"
