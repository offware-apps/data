name: Refresh sources

on:
  # The day before the weekly build, so a newer source is published on Monday.
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never fails: a source that can't be read keeps its saved copy until next week.
      - run: npm run refresh
      - name: Check and commit what changed
        run: |
          if git diff --quiet -- data/reference; then
            echo "Nothing changed."
            exit 0
          fi
          npm run check
          npm run build -- tests/fixtures/raw.json --offline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference
          git commit -m "Refresh saved sources"
          git push
