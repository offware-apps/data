name: Publish dataset

on:
  # Monday, after Sunday's refresh of the saved sources.
  schedule:
    - cron: "0 3 * * 1"
  # Publish a merged change straight away instead of at the next scheduled run.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # First, so a repository without Pages fails before anything else runs.
      - uses: actions/configure-pages@v5
      - run: npm ci
      # From the committed data/raw/wikidata.json, which fetch-wikidata.yml updates monthly.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
